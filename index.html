<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Days of Drawing — Victoria Yu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@200;300;400&display=swap');family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #F2F0ED;
    font-family: 'Libre Baskerville', Georgia, serif;
    color: #1A1A1A;
  }

  /* ── Header ── */
  .site-header {
    padding: 2.5rem 3.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: none;
  }
  .site-title { font-size: 22px; font-weight: 300; letter-spacing: 0.08em; font-family: 'Cormorant Garamond', Georgia, serif; color: #1A1A1A; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 300; font-size: 24px; }
  .site-meta {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px; color: #888888; letter-spacing: 0.07em;
    text-align: right; line-height: 1.8;
  }

  /* ── Tag bar ── */
  .tag-bar {
    padding: 1rem 3.5rem;
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap;
  }
  .tag-label {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; color: #888888; letter-spacing: 0.1em; margin-right: 4px;
  }
  .tag-pill {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; padding: 4px 12px; border-radius: 20px;
    border: 0.5px solid #CCCAC6; background: transparent;
    color: #555555; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s;
  }
  .tag-pill:hover { background: #F5F5F5; }
  .tag-pill.active { background: #1A1A1A; color: #FFFFFF; border-color: #1A1A1A; }

  /* ── Grid ── */
  .grid-wrap { padding: 2rem 3.5rem 1rem; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }

  /* ── Cell ── */
  .cell {
    position: relative; aspect-ratio: 1 / 1;
    overflow: hidden; cursor: pointer; background: #F0EEEB;
  }
  .cell img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; transition: transform 0.3s ease;
  }
  .cell:hover img { transform: scale(1.03); }
  .cell-overlay {
    position: absolute; inset: 0;
    background: rgba(242, 240, 237, 0.93);
    display: flex; flex-direction: column; justify-content: center;
    padding: 16px 18px; opacity: 0; transition: opacity 0.2s ease;
  }
  .cell:hover .cell-overlay { opacity: 1; }
  .cell-day {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 9px; color: #888888; letter-spacing: 0.12em; margin-bottom: 6px;
  }
  .cell-title { font-size: 14px; font-weight: 400; color: #1A1A1A; line-height: 1.35; margin-bottom: 5px; }
  .cell-medium {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 9px; color: #999999; letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .cell-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .cell-tag {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 9px; padding: 2px 7px; border-radius: 20px;
    border: 0.5px solid #CCCAC6; color: #999999;
  }
  .cell-price {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px; color: #1A1A1A; letter-spacing: 0.03em;
  }
  .cell-price.sold { color: #888888; text-decoration: line-through; }
  .sold-mark {
    position: absolute; top: 10px; right: 10px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 9px; letter-spacing: 0.07em;
    background: rgba(242, 240, 237, 0.85); color: #888888;
    padding: 2px 8px; border-radius: 20px; pointer-events: none;
  }

  /* ── Lightbox ── */
  .lb-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(10, 10, 10, 0.88);
    z-index: 100; align-items: center; justify-content: center; padding: 2rem;
  }
  .lb-backdrop.open { display: flex; }
  .lb-box {
    background: #F2F0ED; max-width: 820px; width: 100%;
    display: grid; grid-template-columns: 1fr 1fr;
    max-height: 90vh; overflow: hidden; position: relative;
  }
  .lb-img-wrap {
    background: #F0EEEB;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; min-height: 320px;
  }
  .lb-img-wrap img { width: 100%; height: 100%; object-fit: contain; max-height: 90vh; }
  .lb-img-placeholder {
    width: 100%; height: 100%; min-height: 320px;
    background: #F0EEEB;
  }
  .lb-info {
    padding: 2.5rem 2rem; display: flex; flex-direction: column;
    justify-content: center; gap: 10px; overflow-y: auto;
  }
  .lb-day {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; color: #888888; letter-spacing: 0.12em;
  }
  .lb-title { font-size: 20px; font-weight: 400; color: #1A1A1A; line-height: 1.3; }
  .lb-medium {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; color: #999999; letter-spacing: 0.07em; text-transform: uppercase;
  }
  .lb-note {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px; color: #555555; line-height: 1.75; margin-top: 4px;
  }
  .lb-divider { border: none; border-top: 0.5px solid #DDDBD7; margin: 4px 0; }
  .lb-price {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px; color: #1A1A1A; letter-spacing: 0.03em;
  }
  .lb-price.sold { color: #888888; text-decoration: line-through; }
  .lb-sold-note {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; color: #888888; letter-spacing: 0.07em;
  }
  .lb-inquire {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; letter-spacing: 0.08em;
    padding: 8px 18px; border: 0.5px solid #CCCAC6;
    background: transparent; color: #555555; cursor: pointer;
    border-radius: 2px; transition: all 0.15s; width: fit-content; margin-top: 4px;
  }
  .lb-inquire:hover { background: #1A1A1A; color: #FFFFFF; border-color: #1A1A1A; }
  .lb-close {
    position: absolute; top: 1rem; right: 1.25rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 18px; color: #1A1A1A; cursor: pointer;
    background: none; border: none; opacity: 0.4; line-height: 1;
  }
  .lb-close:hover { opacity: 1; }

  /* ── Footer ── */
  .site-footer {
    padding: 1.5rem 3.5rem 2.5rem;
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 1rem;
  }
  .footer-text {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; color: #888888; letter-spacing: 0.07em; line-height: 1.8;
  }
  .footer-contact a {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px; color: #555555; letter-spacing: 0.07em;
    text-decoration: none; border-bottom: 0.5px solid #CCCAC6; padding-bottom: 1px;
  }

  /* ── Loading / Error ── */
  .state-msg {
    grid-column: 1 / -1; padding: 3rem 0; text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px; color: #888888; letter-spacing: 0.06em;
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .site-header, .tag-bar, .grid-wrap, .site-footer { padding-left: 2rem; padding-right: 2rem; }
    .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  }
  @media (max-width: 640px) {
    .lb-box { grid-template-columns: 1fr; }
    .lb-img-wrap { min-height: 220px; max-height: 45vw; }
    .lb-info { padding: 1.5rem; }
  }
  @media (max-width: 600px) {
    .site-header, .tag-bar, .grid-wrap, .site-footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .site-title { font-size: 18px; }
  }
  @media (max-width: 400px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="site-header">
  <div>
    <div class="site-title">100 days of drawing</div>
    <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:#A09D96;margin-top:5px;letter-spacing:0.05em">
      Victoria Yu · Tokyo · 2026
    </div>
  </div>
  <div class="site-meta">
    <span id="progress-display">— / 100</span><br>
    Ready for collection
  </div>
</header>

<div class="tag-bar" id="tag-bar" style="display:none">
  <span class="tag-label">filter</span>
  <button class="tag-pill active" data-tag="all">All</button>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid">
    <div class="state-msg">Loading…</div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-text">
    <span id="avail-display"></span><br>
    Inquiries welcome
  </div>
  <div class="footer-contact" style="display:flex;gap:1.5rem;align-items:center">
    <a href="https://instagram.com/victoria_hanare" target="_blank">@victoria_hanare</a>
    <a href="mailto:vpyy830@gmail.com">vpyy830@gmail.com</a>
  </div>
</footer>

<!-- Lightbox -->
<div class="lb-backdrop" id="lb-backdrop">
  <div class="lb-box" id="lb-box">
    <div class="lb-img-wrap" id="lb-img-wrap"></div>
    <div class="lb-info">
      <div class="lb-day" id="lb-day"></div>
      <div class="lb-title" id="lb-title"></div>
      <div class="lb-medium" id="lb-medium"></div>
      <div class="lb-note" id="lb-note"></div>
      <hr class="lb-divider">
      <div class="lb-price" id="lb-price"></div>
      <div class="lb-sold-note" id="lb-sold-note"></div>
      <button class="lb-inquire" id="lb-inquire">Inquire →</button>
    </div>
    <button class="lb-close" id="lb-close">✕</button>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7RfdhDWdcrBERxF68aDpG2l_ap0oZurdDVfu0Ef6uF7YfB6ERCdBzema0M14jPi4q7rO-Gyelgv89/pub?output=csv';

// Drive 圖片連結轉換
function driveUrl(raw) {
  if (!raw) return '';
  if (raw.startsWith('http') && !raw.includes('drive.google')) return raw;
  let id = raw;
  const m = raw.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) id = m[1];
  return `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
}

// 解析 CSV
function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return {
      day:    parseInt(cols[0]) || 0,
      title:  cols[1] || '',
      medium: cols[2] || '',
      price:  cols[3] || '',
      sold:   (cols[4] || '').toLowerCase() === 'true',
      tags:   (cols[5] || '').split(',').map(t => t.trim()).filter(Boolean),
      img:    driveUrl(cols[6] || ''),
      note:   cols[7] || '',
    };
  }).filter(d => d.day > 0 && d.title);
}

// Tags
function collectTags(drawings) {
  const set = new Set();
  drawings.forEach(d => d.tags.forEach(t => { if (t) set.add(t); }));
  return [...set].sort();
}

function buildTagBar(tags) {
  const bar = document.getElementById('tag-bar');
  [...bar.querySelectorAll('.tag-pill:not([data-tag="all"])')].forEach(el => el.remove());
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-pill';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    bar.appendChild(btn);
  });
  const avail = document.createElement('button');
  avail.className = 'tag-pill';
  avail.dataset.tag = '__available__';
  avail.textContent = 'Available';
  bar.appendChild(avail);
  bar.style.display = 'flex';
  bar.querySelectorAll('.tag-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      bar.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      filterGrid(pill.dataset.tag);
    });
  });
}

function filterGrid(tag) {
  document.querySelectorAll('.cell').forEach(cell => {
    const cellTags = (cell.dataset.tags || '').split(',');
    const isAvail = cell.dataset.sold !== 'true';
    const show = tag === 'all' || cellTags.includes(tag) || (tag === '__available__' && isAvail);
    cell.style.display = show ? '' : 'none';
  });
}

// Lightbox
let allDrawings = [];

function openLightbox(d) {
  const backdrop = document.getElementById('lb-backdrop');
  document.getElementById('lb-day').textContent = 'Day ' + String(d.day).padStart(2, '0');
  document.getElementById('lb-title').textContent = d.title;
  document.getElementById('lb-medium').textContent = d.medium;
  document.getElementById('lb-note').textContent = d.note || '';
  document.getElementById('lb-note').style.display = d.note ? 'block' : 'none';

  const priceEl = document.getElementById('lb-price');
  const soldNote = document.getElementById('lb-sold-note');
  const inquireBtn = document.getElementById('lb-inquire');
  if (d.sold) {
    priceEl.className = 'lb-price sold';
    priceEl.textContent = d.price;
    soldNote.textContent = 'This work has been sold.';
    soldNote.style.display = 'block';
    inquireBtn.style.display = 'none';
  } else {
    priceEl.className = 'lb-price';
    priceEl.textContent = d.price;
    soldNote.style.display = 'none';
    inquireBtn.style.display = 'block';
    inquireBtn.onclick = () => {
      window.location.href = `mailto:vpyy830@gmail.com?subject=Inquiry: ${encodeURIComponent(d.title)}&body=Hi Victoria,%0A%0AI'm interested in "${encodeURIComponent(d.title)}" (Day ${d.day}). Could you share more details?%0A%0AThank you`;
    };
  }

  const imgWrap = document.getElementById('lb-img-wrap');
  if (d.img) {
    imgWrap.innerHTML = `<img src="${d.img}" alt="${d.title}">`;
  } else {
    imgWrap.innerHTML = '<div class="lb-img-placeholder"></div>';
  }

  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lb-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-backdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('lb-backdrop')) closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// Grid
function buildGrid(drawings) {
  allDrawings = drawings;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (!drawings.length) {
    grid.innerHTML = '<div class="state-msg">No drawings yet — check back soon.</div>';
    return;
  }

  const availCount = drawings.filter(d => !d.sold).length;
  document.getElementById('progress-display').textContent = `${drawings.length} / 100`;
  document.getElementById('avail-display').textContent = `${availCount} works available`;

  drawings.forEach(d => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.tags = d.tags.join(',');
    cell.dataset.sold = d.sold;

    const tagsHTML = d.tags.map(t => `<span class="cell-tag">${t}</span>`).join('');
    const priceHTML = d.sold
      ? `<div class="cell-price sold">${d.price}</div>`
      : `<div class="cell-price">${d.price}</div>`;

    cell.innerHTML = `
      ${d.img ? `<img src="${d.img}" alt="${d.title}" loading="lazy">` : ''}
      ${d.sold ? '<div class="sold-mark">Sold</div>' : ''}
      <div class="cell-overlay">
        <div class="cell-day">Day ${String(d.day).padStart(2,'0')}</div>
        <div class="cell-title">${d.title}</div>
        <div class="cell-medium">${d.medium}</div>
        ${tagsHTML ? `<div class="cell-tags">${tagsHTML}</div>` : ''}
        ${priceHTML}
      </div>`;

    cell.addEventListener('click', () => openLightbox(d));
    grid.appendChild(cell);
  });

  const tags = collectTags(drawings);
  if (tags.length) buildTagBar(tags);
}

// Load
async function load() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    buildGrid(parseCSV(text));
  } catch (err) {
    document.getElementById('grid').innerHTML = `
      <div class="state-msg">
        讀取失敗。請確認 Google Sheet 已「發布到網路」。<br><br>
        <small style="opacity:0.6">${err.message}</small>
      </div>`;
  }
}

load();
</script>
</body>
</html>
