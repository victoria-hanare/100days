<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Days of Drawing — Victoria Yu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: #F2F0ED; font-family: 'Libre Baskerville', Georgia, serif; color: #1A1A1A; }

  .site-header { padding: 2.5rem 3.5rem 2rem; display: flex; justify-content: space-between; align-items: flex-end; }
  .site-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; font-weight: 300; letter-spacing: 0.18em; color: #1A1A1A; text-transform: uppercase; }
  .site-meta { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; color: #888888; letter-spacing: 0.07em; text-align: right; line-height: 1.8; }

  .tag-bar { padding: 1rem 3.5rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; color: #888888; letter-spacing: 0.1em; margin-right: 4px; }
  .tag-pill { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid #CCCAC6; background: transparent; color: #555555; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; }
  .tag-pill:hover { background: #EEECEA; }
  .tag-pill.active { background: #1A1A1A; color: #F2F0ED; border-color: #1A1A1A; }

  .grid-wrap { padding: 2rem 3.5rem 1rem; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }

  .cell { position: relative; aspect-ratio: 1/1; overflow: hidden; cursor: pointer; background: #EEECEA; }
  .cell img { display: block; width: 100%; height: 100%; object-fit: cover;  transition: transform 0.3s ease; }
  .cell:hover img { transform: scale(1.03); }
  .cell-overlay { position: absolute; inset: 0; background: rgba(242,240,237,0.93); display: flex; flex-direction: column; justify-content: center; padding: 16px 18px; opacity: 0; transition: opacity 0.2s ease; }
  .cell:hover .cell-overlay { opacity: 1; }
  .cell-day { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; color: #888888; letter-spacing: 0.12em; margin-bottom: 6px; }
  .cell-title { font-size: 13px; font-weight: 400; color: #1A1A1A; line-height: 1.35; margin-bottom: 4px; }
  .cell-medium { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; color: #999999; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .cell-price { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; color: #1A1A1A; letter-spacing: 0.03em; }
  .cell-price.sold { color: #888888; text-decoration: line-through; }
  .sold-mark { position: absolute; top: 10px; right: 10px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; letter-spacing: 0.07em; background: rgba(242,240,237,0.85); color: #888888; padding: 2px 8px; border-radius: 20px; pointer-events: none; }

  /* ── Lightbox ── */
  .lb-backdrop { display: none; position: fixed; inset: 0; background: rgba(10,10,10,0.88); z-index: 100; align-items: center; justify-content: center; padding: 2rem; }
  .lb-backdrop.open { display: flex; }
  .lb-box { background: #F2F0ED; max-width: 820px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; max-height: 90vh; overflow: hidden; position: relative; }
  .lb-img-wrap { background: #EEECEA; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 340px; }
  .lb-img-wrap img { width: 100%; height: 100%; object-fit: contain; max-height: 90vh; }
  .lb-img-placeholder { width: 100%; min-height: 340px; background: #EEECEA; }

  .lb-info { padding: 2.5rem 2rem; display: flex; flex-direction: column; justify-content: center; gap: 8px; overflow-y: auto; }
  .lb-day { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; color: #888888; letter-spacing: 0.15em; text-transform: uppercase; }
  .lb-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 400; color: #1A1A1A; line-height: 1.3; }
  .lb-medium { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; color: #999999; letter-spacing: 0.07em; text-transform: uppercase; }
  .lb-size { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; color: #AAAAAA; letter-spacing: 0.06em; }
  .lb-note { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; color: #555555; line-height: 1.8; margin-top: 4px; }
  .lb-divider { border: none; border-top: 0.5px solid #DDDBD7; margin: 6px 0; }
  .lb-price { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; color: #1A1A1A; letter-spacing: 0.05em; }
  .lb-price.sold { color: #888888; text-decoration: line-through; }
  .lb-sold-note { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; color: #888888; letter-spacing: 0.05em; }

  .lb-btn { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; letter-spacing: 0.1em; padding: 9px 20px; border: 0.5px solid #1A1A1A; background: #1A1A1A; color: #F2F0ED; cursor: pointer; transition: all 0.15s; width: fit-content; margin-top: 6px; text-decoration: none; display: inline-block; }
  .lb-btn:hover { background: transparent; color: #1A1A1A; }
  .lb-btn.outline { background: transparent; color: #555555; border-color: #CCCAC6; }
  .lb-btn.outline:hover { background: #1A1A1A; color: #F2F0ED; border-color: #1A1A1A; }

  .lb-close { position: absolute; top: 1rem; right: 1.25rem; font-size: 18px; color: #1A1A1A; cursor: pointer; background: none; border: none; opacity: 0.35; line-height: 1; }
  .lb-close:hover { opacity: 1; }

  .site-footer { padding: 1.5rem 3.5rem 2.5rem; display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
  .footer-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; color: #888888; letter-spacing: 0.07em; line-height: 1.8; }
  .footer-contact a { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; color: #555555; letter-spacing: 0.07em; text-decoration: none; border-bottom: 0.5px solid #CCCAC6; padding-bottom: 1px; }

  .state-msg { grid-column: 1/-1; padding: 3rem 0; text-align: center; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; color: #888888; letter-spacing: 0.06em; }

  @media (max-width: 900px) {
    .site-header, .tag-bar, .grid-wrap, .site-footer { padding-left: 2rem; padding-right: 2rem; }
    .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  }
  @media (max-width: 640px) {
    .lb-box { grid-template-columns: 1fr; }
    .lb-img-wrap { min-height: 200px; max-height: 45vw; }
    .lb-info { padding: 1.5rem; }
  }
  @media (max-width: 600px) {
    .site-header, .tag-bar, .grid-wrap, .site-footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .site-title { font-size: 18px; }
  }
  @media (max-width: 400px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="site-header">
  <div>
    <div class="site-title">100 days of drawing</div>
    <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:#888888;margin-top:5px;letter-spacing:0.05em">
      Victoria Yu · Tokyo · 2026
    </div>
  </div>
  <div class="site-meta">
    <span id="progress-display">— / 100</span><br>
    Ready for collection
  </div>
</header>

<div class="tag-bar" id="tag-bar" style="display:none">
  <span class="tag-label">filter</span>
  <button class="tag-pill active" data-tag="all">All</button>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid">
    <div class="state-msg">Loading…</div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-text">
    <span id="avail-display"></span><br>
    Inquiries welcome
  </div>
  <div class="footer-contact" style="display:flex;gap:1.5rem;align-items:center">
    <a href="https://instagram.com/victoria_hanare" target="_blank">@victoria_hanare</a>
    <a href="mailto:vpyy830@gmail.com">vpyy830@gmail.com</a>
  </div>
</footer>

<!-- Lightbox -->
<div class="lb-backdrop" id="lb-backdrop">
  <div class="lb-box">
    <div class="lb-img-wrap" id="lb-img-wrap"></div>
    <div class="lb-info">
      <div class="lb-day" id="lb-day"></div>
      <div class="lb-title" id="lb-title"></div>
      <div class="lb-medium" id="lb-medium"></div>
      <div class="lb-size" id="lb-size"></div>
      <div class="lb-note" id="lb-note"></div>
      <hr class="lb-divider">
      <div class="lb-price" id="lb-price"></div>
      <div class="lb-sold-note" id="lb-sold-note"></div>
      <div id="lb-action"></div>
    </div>
    <button class="lb-close" id="lb-close">✕</button>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT7RfdhDWdcrBERxF68aDpG2l_ap0oZurdDVfu0Ef6uF7YfB6ERCdBzema0M14jPi4q7rO-Gyelgv89/pub?output=csv';

// Stripe links by price
const STRIPE_LINKS = {
  '¥3,500': 'https://buy.stripe.com/aFa4gy2M7aZn82tdJc6wE01',
  '¥4,000': 'https://buy.stripe.com/28E28qfyTaZnaaBax06wE00',
};

function driveUrl(raw) {
  if (!raw) return '';
  if (raw.startsWith('http') && !raw.includes('drive.google')) return raw;
  let id = raw;
  const m = raw.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) id = m[1];
  return `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return {
      day:     parseInt(cols[0]) || 0,
      title:   cols[1] || '',
      medium:  cols[2] || '',
      price:   cols[3] || '',
      sold:    (cols[4] || '').toLowerCase() === 'true',
      tags:    (cols[5] || '').split(',').map(t => t.trim()).filter(Boolean),
      img:     driveUrl(cols[6] || ''),
      note:    cols[7] || '',
      size:    cols[8] || '',
      buy_url: cols[9] || '',
      focus:   cols[10] || 'center',
    };
  }).filter(d => d.day > 0 && d.title);
}

function collectTags(drawings) {
  const set = new Set();
  drawings.forEach(d => d.tags.forEach(t => { if (t) set.add(t); }));
  return [...set].sort();
}

function buildTagBar(tags) {
  const bar = document.getElementById('tag-bar');
  [...bar.querySelectorAll('.tag-pill:not([data-tag="all"])')].forEach(el => el.remove());
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-pill';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    bar.appendChild(btn);
  });
  const avail = document.createElement('button');
  avail.className = 'tag-pill';
  avail.dataset.tag = '__available__';
  avail.textContent = 'Available';
  bar.appendChild(avail);
  bar.style.display = 'flex';
  bar.querySelectorAll('.tag-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      bar.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      filterGrid(pill.dataset.tag);
    });
  });
}

function filterGrid(tag) {
  document.querySelectorAll('.cell').forEach(cell => {
    const cellTags = (cell.dataset.tags || '').split(',');
    const isAvail = cell.dataset.sold !== 'true';
    const show = tag === 'all' || cellTags.includes(tag) || (tag === '__available__' && isAvail);
    cell.style.display = show ? '' : 'none';
  });
}

function openLightbox(d) {
  document.getElementById('lb-day').textContent = 'Day ' + String(d.day).padStart(2, '0');
  document.getElementById('lb-title').textContent = d.title;
  document.getElementById('lb-medium').textContent = d.medium;

  const sizeEl = document.getElementById('lb-size');
  sizeEl.textContent = d.size || '';
  sizeEl.style.display = d.size ? 'block' : 'none';

  const noteEl = document.getElementById('lb-note');
  const noteText = (d.note || '').trim();
  noteEl.textContent = noteText;
  noteEl.style.display = noteText ? 'block' : 'none';

  const priceEl = document.getElementById('lb-price');
  const soldNote = document.getElementById('lb-sold-note');
  const actionEl = document.getElementById('lb-action');

  if (d.sold) {
    priceEl.className = 'lb-price sold';
    priceEl.textContent = d.price;
    soldNote.textContent = 'This work has been sold.';
    soldNote.style.display = 'block';
    actionEl.innerHTML = '';
  } else {
    priceEl.className = 'lb-price';
    priceEl.textContent = d.price;
    soldNote.style.display = 'none';

    // Buy button: use buy_url from sheet, or fall back to Stripe links by price
    const buyUrl = d.buy_url || STRIPE_LINKS[d.price] || '';
    if (buyUrl) {
      actionEl.innerHTML = `<a class="lb-btn" href="${buyUrl}" target="_blank">Buy →</a>`;
    } else {
      actionEl.innerHTML = `<button class="lb-btn outline" onclick="inquire('${d.title.replace(/'/g,"\\'")}', ${d.day})">Inquire →</button>`;
    }
  }

  const imgWrap = document.getElementById('lb-img-wrap');
  imgWrap.innerHTML = d.img
    ? `<img src="${d.img}" alt="${d.title}">`
    : '<div class="lb-img-placeholder"></div>';

  document.getElementById('lb-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function inquire(title, day) {
  window.location.href = `mailto:vpyy830@gmail.com?subject=Inquiry: ${encodeURIComponent(title)}&body=Hi Victoria,%0A%0AI'm interested in "${encodeURIComponent(title)}" (Day ${day}). Could you share more details?%0A%0AThank you`;
}

function closeLightbox() {
  document.getElementById('lb-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-backdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('lb-backdrop')) closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function buildGrid(drawings) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!drawings.length) {
    grid.innerHTML = '<div class="state-msg">No drawings yet — check back soon.</div>';
    return;
  }
  const availCount = drawings.filter(d => !d.sold).length;
  document.getElementById('progress-display').textContent = `${drawings.length} / 100`;
  document.getElementById('avail-display').textContent = `${availCount} works available`;

  drawings.forEach(d => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.tags = d.tags.join(',');
    cell.dataset.sold = d.sold;
    const priceHTML = d.sold
      ? `<div class="cell-price sold">${d.price}</div>`
      : `<div class="cell-price">${d.price}</div>`;
    cell.innerHTML = `
      ${d.img ? `<img src="${d.img}" alt="${d.title}" loading="lazy" style="object-fit:cover;object-position:${d.focus||'center'}">` : ''}
      ${d.sold ? '<div class="sold-mark">Sold</div>' : ''}
      <div class="cell-overlay">
        <div class="cell-day">Day ${String(d.day).padStart(2,'0')}</div>
        <div class="cell-title">${d.title}</div>
        <div class="cell-medium">${d.medium}</div>
        ${priceHTML}
      </div>`;
    cell.addEventListener('click', () => openLightbox(d));
    grid.appendChild(cell);
  });

  const tags = collectTags(drawings);
  if (tags.length) buildTagBar(tags);
}

async function load() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    buildGrid(parseCSV(text));
  } catch (err) {
    document.getElementById('grid').innerHTML = `
      <div class="state-msg">
        Could not load drawings. Please check back soon.<br><br>
        <small style="opacity:0.5">${err.message}</small>
      </div>`;
  }
}

load();
</script>
</body>
</html>
